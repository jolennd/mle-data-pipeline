[project]
name = "mle-data-pipeline-project"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "click>=8.5.0",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "prefect>=3.9.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.4",
]

[tool.ty.environment]
root = [".", "src"]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
# Prefect's server still uses FastAPI's removed min_items argument.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2", "fastapi<0.155"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: needs more than one component",
  "dbserver: needs the database server up",
  "docker: needs Docker",
  "model: model quality tests",
  "data: data quality tests",
  "deploy: needs a deployed target",
]
