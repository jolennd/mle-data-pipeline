name: transform
version: "1.0.0"
profile: transform
model-paths: ["models"]
models:
  transform:
    +materialized: view
seed-paths: ["seeds"]
test-paths: ["tests"]
vars:
  # Range from ADR 2: pickup dates >= range_start and < range_end are kept in staging.
  range_start: "2025-01-01"
  range_end: "2025-04-01"
