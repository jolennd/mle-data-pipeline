# Every value comes from DBT_* variables set by transform/dbt_env.py from DB_CONN.
# A missing variable makes dbt fail loudly. Do not put literal credentials here.
transform:
  target: postgres
  outputs:
    postgres:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT') | as_number }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DBNAME') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 4
    duckdb:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 1
